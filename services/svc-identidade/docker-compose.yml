services:
  svc-identidade:
    build:
      context: ../..
      dockerfile: Dockerfile.nest
      args: { APP: svc-identidade }
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo-identidade:27017/identidade}
      SVC_CARTEIRA_URL: ${SVC_CARTEIRA_URL:-http://svc-carteira:3000}
      # Event broker; the default is the Azurite emulator from services/fn-notificacoes/docker-compose.yml
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}
    ports:
      - "3001:3000"
    depends_on:
      - mongo-identidade

  mongo-identidade:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-identidade:/data/db

volumes:
  mongo-identidade:
