packages:
  - apps/*
  - services/*

# Required by pnpm deploy (used in the Dockerfiles)
injectWorkspacePackages: true

allowBuilds:
  '@scarf/scarf': false # swagger-ui telemetry, no need to run it
  es5-ext: false # postinstall only prints a message
  esbuild: true
  lightningcss: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/query-devtools@5.105.0'
  - '@tanstack/react-query-devtools@5.105.0'
  - '@tanstack/react-query@5.105.0'
